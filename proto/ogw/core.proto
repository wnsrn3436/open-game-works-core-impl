syntax = "proto3";
package ogw.core;

import "ogw/options.proto";

// The envelope of every response.
message ResponseEnvelope {
  // Server time when the response was made. Unix ms.
  int64 server_time_at = 1;
  // The failure of the request. Null on success.
  ServerError error = 2;
  // UserState delta changed by this request.
  UserStateDelta user_state = 3;
  // UserState delta changed by out-of-request changes.
  UserStateDelta pending_user_state = 4;
  // Item changes of this request and of out-of-request changes, in the order item-ledger recorded them.
  repeated ItemChange item_changes = 5;
  // Items sent by mail by this request and by out-of-request changes because they could not be granted right away.
  repeated ItemMail item_mails = 6;
  // Response message bytes.
  bytes body = 7;
}

// The failure of a request.
message ServerError {
  // CoreError or GameError value.
  int32 code = 1;
  // Failure detail. Filled only in an environment that includes DEV code.
  string detail = 2;
  // Ban detail. Filled only when code is BANNED.
  BanDetail ban = 3;
}

// The ban of a BANNED error response.
message BanDetail {
  // Banned user ID.
  int64 user_id = 1;
  // Time the ban ends. Unix ms. 0 when the ban does not end.
  int64 until_at = 2;
  // Address of the web account deletion page.
  string deletion_url = 3;
  // Access token. Filled only by the ban login.
  string access_token = 4;
  // Session signing key. Filled only by the ban login.
  string session_signing_key = 5;
  // Public code of the banned user.
  string public_code = 6;
}

// UserState delta.
message UserStateDelta {
  // True when the delta holds the whole UserState.
  bool full = 1;
  // Entries in kind order.
  repeated UserStateEntry entries = 2;
}

// One upsert or delete of a UserState delta.
message UserStateEntry {
  // Kind message name.
  string kind = 1;
  // Item ID of a list kind. 0 for a single kind.
  int64 id = 2;
  // Kind message bytes for an upsert. Empty for a delete.
  bytes value = 3;
  // True for a delete.
  bool deleted = 4;
}

