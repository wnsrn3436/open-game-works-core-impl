// Core rpcs. POST /core/<Name>.
service Core {
  // Logs in with a provider credential. Creates the user on the first guest login.
  // changes: ConsentUserState
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (ogw.sensitive) = true;
  }
  // Logs in again with the login token.
  // changes: ConsentUserState
  rpc AutoLogin(AutoLoginRequest) returns (AutoLoginResponse) {
    option (ogw.sensitive) = true;
  }
  // Issues a new access token from the login token.
  // changes: none
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  // Ends the login of this device.
  // changes: none
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (ogw.retry) = true;
  }
  // Links a social account to the user.
  // changes: none
  rpc LinkAccount(LinkAccountRequest) returns (LinkAccountResponse) {
    option (ogw.retry) = true;
    option (ogw.sensitive) = true;
  }
  // Deletes the account and every saved state of the user.
  // changes: all
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse) {
    option (ogw.retry) = true;
  }
  // Issues a code for the web account deletion page.
  // changes: none
  rpc IssueDeletionCode(IssueDeletionCodeRequest) returns (IssueDeletionCodeResponse) {
    option (ogw.retry) = true;
  }
  // Returns the current version and document URL of each terms item.
  // changes: none
  rpc GetTerms(GetTermsRequest) returns (GetTermsResponse);
  // Records the birth year and month and recomputes the age band.
  // changes: ConsentUserState, all
  rpc ConfirmAge(ConfirmAgeRequest) returns (ConfirmAgeResponse) {
    option (ogw.retry) = true;
    option (ogw.sensitive) = true;
  }
  // Records the privacy choices of the user.
  // changes: ConsentUserState
  rpc UpdateConsent(UpdateConsentRequest) returns (UpdateConsentResponse) {
    option (ogw.retry) = true;
  }
  // Records the ad push choices of the user.
  // changes: ConsentUserState
  rpc UpdatePushConsent(UpdatePushConsentRequest) returns (UpdatePushConsentResponse) {
    option (ogw.retry) = true;
  }
  // Returns the pending delta, or the whole UserState when full is true.
  // changes: none
  rpc Resync(ResyncRequest) returns (ResyncResponse) {
    option (ogw.silent) = true;
  }
  // Stores error log entries the client sent.
  // changes: none
  rpc ReportClientErrors(ReportClientErrorsRequest) returns (ReportClientErrorsResponse) {
    option (ogw.retry) = true;
    option (ogw.silent) = true;
  }
  // Stores analytics events the client sent.
  // changes: none
  rpc ReportAnalyticsEvents(ReportAnalyticsEventsRequest) returns (ReportAnalyticsEventsResponse) {
    option (ogw.retry) = true;
    option (ogw.silent) = true;
  }
  // Reports the result of a match the user took part in.
  // changes: content
  rpc ReportMatchResult(ReportMatchResultRequest) returns (ReportMatchResultResponse) {
    option (ogw.retry) = true;
  }
  // Marks a mail as read.
  // changes: MailUserState
  rpc ReadMail(ReadMailRequest) returns (ReadMailResponse) {
    option (ogw.retry) = true;
  }
  // Claims the attachments of a mail.
  // changes: ItemBalanceUserState, MailUserState, content
  rpc ClaimMail(ClaimMailRequest) returns (ClaimMailResponse) {
    option (ogw.retry) = true;
  }
  // Claims the attachments of every claimable mail.
  // changes: ItemBalanceUserState, MailUserState, content
  rpc ClaimAllMail(ClaimAllMailRequest) returns (ClaimAllMailResponse) {
    option (ogw.retry) = true;
  }
  // Buys a shop product with items.
  // changes: ItemBalanceUserState, MailUserState, ShopPurchaseUserState, content
  rpc BuyShopProduct(BuyShopProductRequest) returns (BuyShopProductResponse) {
    option (ogw.retry) = true;
  }
  // Checks that a store product can be bought before the store payment.
  // changes: none
  rpc CheckPurchase(CheckPurchaseRequest) returns (CheckPurchaseResponse);
  // Verifies a store receipt and grants the product.
  // changes: ItemBalanceUserState, MailUserState, IapPurchaseUserState, SubscriptionUserState, content
  rpc VerifyPurchase(VerifyPurchaseRequest) returns (VerifyPurchaseResponse) {
    option (ogw.retry) = true;
    option (ogw.sensitive) = true;
  }
  // Verifies an unfinished or restored store purchase and grants the product.
  // changes: ItemBalanceUserState, MailUserState, IapPurchaseUserState, SubscriptionUserState, content
  rpc RecoverPurchase(RecoverPurchaseRequest) returns (RecoverPurchaseResponse) {
    option (ogw.retry) = true;
    option (ogw.sensitive) = true;
    option (ogw.silent) = true;
  }
  // Refreshes the subscription states of the user from the stores.
  // changes: none
  rpc SyncSubscriptions(SyncSubscriptionsRequest) returns (SyncSubscriptionsResponse) {
    option (ogw.retry) = true;
    option (ogw.silent) = true;
  }
  // Claims the daily reward of a pass product.
  // changes: ItemBalanceUserState, MailUserState, IapPurchaseUserState, content
  rpc ClaimIapDaily(ClaimIapDailyRequest) returns (ClaimIapDailyResponse) {
    option (ogw.retry) = true;
  }
  // Starts an ad reward and returns the notify ID the ad network sends back.
  // changes: none
  rpc BeginAdReward(BeginAdRewardRequest) returns (BeginAdRewardResponse) {
    option (ogw.retry) = true;
    option (ogw.silent) = true;
  }
  // Grants the ad reward after the ad network callback.
  // changes: none
  rpc ClaimAdReward(ClaimAdRewardRequest) returns (ClaimAdRewardResponse) {
    option (ogw.retry) = true;
    option (ogw.silent) = true;
  }
  // Returns entries of a ranking board from the top.
  // changes: none
  rpc GetRankingTop(GetRankingTopRequest) returns (GetRankingTopResponse);
  // Returns the entry of the user and the entries around it.
  // changes: none
  rpc GetRankingAround(GetRankingAroundRequest) returns (GetRankingAroundResponse);
  // Applies the season change to the ratings of the user.
  // changes: MailUserState, RatingUserState
  rpc RefreshRating(RefreshRatingRequest) returns (RefreshRatingResponse) {
    option (ogw.retry) = true;
    option (ogw.silent) = true;
  }
  // Saves the reached step of a tutorial.
  // changes: TutorialProgressUserState
  rpc SaveTutorialProgress(SaveTutorialProgressRequest) returns (SaveTutorialProgressResponse) {
    option (ogw.retry) = true;
    option (ogw.silent) = true;
  }
  // Returns the rates of a public loot table.
  // changes: none
  rpc GetLootRates(GetLootRatesRequest) returns (GetLootRatesResponse) {
    option (ogw.silent) = true;
  }
  // Draws a gacha banner.
  // changes: ItemBalanceUserState, MailUserState, GachaPityUserState, content
  rpc DrawGacha(DrawGachaRequest) returns (DrawGachaResponse) {
    option (ogw.retry) = true;
  }
  // Returns the rates and pity state of a gacha banner.
  // changes: none
  rpc GetGachaRates(GetGachaRatesRequest) returns (GetGachaRatesResponse) {
    option (ogw.silent) = true;
  }
  // Returns the draw history of the user.
  // changes: none
  rpc ListGachaHistory(ListGachaHistoryRequest) returns (ListGachaHistoryResponse) {
    option (ogw.silent) = true;
  }
  // Claims the reward of a completed mission.
  // changes: ItemBalanceUserState, MailUserState, MissionProgressUserState, content
  rpc ClaimMission(ClaimMissionRequest) returns (ClaimMissionResponse) {
    option (ogw.retry) = true;
  }
  // Claims the reward of today of an attendance calendar.
  // changes: ItemBalanceUserState, MailUserState, AttendanceUserState, content
  rpc ClaimAttendance(ClaimAttendanceRequest) returns (ClaimAttendanceResponse) {
    option (ogw.retry) = true;
  }
  // Redeems a coupon code.
  // changes: ItemBalanceUserState, MailUserState, content
  rpc RedeemCoupon(RedeemCouponRequest) returns (RedeemCouponResponse) {
    option (ogw.retry) = true;
  }
  // Returns the maintenance state and the notices shown now.
  // changes: none
  rpc GetNotices(GetNoticesRequest) returns (GetNoticesResponse);
  // Returns the remote config values and experiment groups of the user.
  // changes: none
  rpc GetRemoteConfig(GetRemoteConfigRequest) returns (GetRemoteConfigResponse) {
    option (ogw.silent) = true;
  }
  // Sets the nickname of the user.
  // changes: ItemBalanceUserState, NicknameUserState, content
  rpc SetNickname(SetNicknameRequest) returns (SetNicknameResponse) {
    option (ogw.retry) = true;
  }
  // Returns the public profiles of users.
  // changes: none
  rpc GetPublicProfiles(GetPublicProfilesRequest) returns (GetPublicProfilesResponse) {
    option (ogw.silent) = true;
  }
  // Returns the public profile of the user that has a public code.
  // changes: none
  rpc FindUserByPublicCode(FindUserByPublicCodeRequest) returns (FindUserByPublicCodeResponse);
  // Sends a friend request.
  // changes: content
  rpc SendFriendRequest(SendFriendRequestRequest) returns (SendFriendRequestResponse) {
    option (ogw.retry) = true;
  }
  // Accepts a received friend request.
  // changes: content
  rpc AcceptFriendRequest(AcceptFriendRequestRequest) returns (AcceptFriendRequestResponse) {
    option (ogw.retry) = true;
  }
  // Declines a received friend request.
  // changes: content
  rpc DeclineFriendRequest(DeclineFriendRequestRequest) returns (DeclineFriendRequestResponse) {
    option (ogw.retry) = true;
  }
  // Cancels a sent friend request.
  // changes: content
  rpc CancelFriendRequest(CancelFriendRequestRequest) returns (CancelFriendRequestResponse) {
    option (ogw.retry) = true;
  }
  // Removes a friend.
  // changes: content
  rpc RemoveFriend(RemoveFriendRequest) returns (RemoveFriendResponse) {
    option (ogw.retry) = true;
  }
  // Returns friends and pending friend requests.
  // changes: none
  rpc GetFriends(GetFriendsRequest) returns (GetFriendsResponse) {
    option (ogw.silent) = true;
  }
  // Searches users by nickname.
  // changes: none
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  // Blocks a user.
  // changes: none
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse) {
    option (ogw.retry) = true;
  }
  // Unblocks a user.
  // changes: none
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse) {
    option (ogw.retry) = true;
  }
  // Returns the users the user blocked.
  // changes: none
  rpc GetBlockedUsers(GetBlockedUsersRequest) returns (GetBlockedUsersResponse) {
    option (ogw.silent) = true;
  }
  // Reports a user.
  // changes: none
  rpc ReportUser(ReportUserRequest) returns (ReportUserResponse) {
    option (ogw.retry) = true;
  }
  // Creates a guild with the user as the leader.
  // changes: content
  rpc CreateGuild(CreateGuildRequest) returns (CreateGuildResponse) {
    option (ogw.retry) = true;
  }
  // Updates the description and join rule of the guild.
  // changes: none
  rpc UpdateGuild(UpdateGuildRequest) returns (UpdateGuildResponse) {
    option (ogw.retry) = true;
  }
  // Returns a guild and its members.
  // changes: none
  rpc GetGuild(GetGuildRequest) returns (GetGuildResponse) {
    option (ogw.silent) = true;
  }
  // Returns the guild of the user, its members and join requests.
  // changes: content
  rpc GetMyGuild(GetMyGuildRequest) returns (GetMyGuildResponse) {
    option (ogw.retry) = true;
    option (ogw.silent) = true;
  }
  // Searches guilds by name.
  // changes: none
  rpc SearchGuilds(SearchGuildsRequest) returns (SearchGuildsResponse) {
    option (ogw.silent) = true;
  }
  // Returns guilds the user can join.
  // changes: none
  rpc ListJoinableGuilds(ListJoinableGuildsRequest) returns (ListJoinableGuildsResponse) {
    option (ogw.silent) = true;
  }
  // Joins a guild or sends a join request.
  // changes: content
  rpc JoinGuild(JoinGuildRequest) returns (JoinGuildResponse) {
    option (ogw.retry) = true;
  }
  // Cancels a sent guild join request.
  // changes: none
  rpc CancelGuildJoinRequest(CancelGuildJoinRequestRequest) returns (CancelGuildJoinRequestResponse) {
    option (ogw.retry) = true;
  }
  // Accepts a join request to the guild.
  // changes: content
  rpc AcceptGuildJoinRequest(AcceptGuildJoinRequestRequest) returns (AcceptGuildJoinRequestResponse) {
    option (ogw.retry) = true;
  }
  // Rejects a join request to the guild.
  // changes: none
  rpc RejectGuildJoinRequest(RejectGuildJoinRequestRequest) returns (RejectGuildJoinRequestResponse) {
    option (ogw.retry) = true;
  }
  // Leaves the guild.
  // changes: content
  rpc LeaveGuild(LeaveGuildRequest) returns (LeaveGuildResponse) {
    option (ogw.retry) = true;
  }
  // Removes a member from the guild.
  // changes: content
  rpc KickGuildMember(KickGuildMemberRequest) returns (KickGuildMemberResponse) {
    option (ogw.retry) = true;
  }
  // Sets the role of a guild member.
  // changes: content
  rpc SetGuildMemberRole(SetGuildMemberRoleRequest) returns (SetGuildMemberRoleResponse) {
    option (ogw.retry) = true;
  }
  // Sends a chat message to a channel.
  // changes: content
  rpc SendChatMessage(SendChatMessageRequest) returns (SendChatMessageResponse) {
    option (ogw.retry) = true;
  }
  // Returns messages of a chat channel.
  // changes: none
  rpc GetChatMessages(GetChatMessagesRequest) returns (GetChatMessagesResponse) {
    option (ogw.silent) = true;
  }
  // Reports a chat message.
  // changes: none
  rpc ReportChatMessage(ReportChatMessageRequest) returns (ReportChatMessageResponse) {
    option (ogw.retry) = true;
  }
  // Returns the chat channels of the user.
  // changes: none
  rpc GetChatChannels(GetChatChannelsRequest) returns (GetChatChannelsResponse) {
    option (ogw.silent) = true;
  }
  // Deletes a message of the guild chat channel.
  // changes: none
  rpc DeleteGuildChatMessage(DeleteGuildChatMessageRequest) returns (DeleteGuildChatMessageResponse) {
    option (ogw.retry) = true;
  }
  // Starts a play session and returns its loadout.
  // changes: content
  rpc StartPlaySession(StartPlaySessionRequest) returns (StartPlaySessionResponse) {
    option (ogw.retry) = true;
  }
  // Continues a play session.
  // changes: content
  rpc ContinuePlaySession(ContinuePlaySessionRequest) returns (ContinuePlaySessionResponse) {
    option (ogw.retry) = true;
  }
  // Finishes a play session with its result.
  // changes: content
  rpc FinishPlaySession(FinishPlaySessionRequest) returns (FinishPlaySessionResponse) {
    option (ogw.retry) = true;
  }
  // Registers the push device token of this device.
  // changes: none
  rpc RegisterPushToken(RegisterPushTokenRequest) returns (RegisterPushTokenResponse) {
    option (ogw.retry) = true;
    option (ogw.sensitive) = true;
    option (ogw.silent) = true;
  }
}

// Core cheats. POST /core/cheat/<Name>. DEV code.
service CoreCheat {
  // Logs in with a dev account name. DEV code.
  // changes: ConsentUserState
  rpc DevLogin(DevLoginRequest) returns (DevLoginResponse);
  // Sets the cheat time offset of the user. DEV code.
  // changes: none
  rpc SetTimeOffset(SetTimeOffsetRequest) returns (SetTimeOffsetResponse);
  // Replaces a UserState entry with a proto3 JSON value. DEV code.
  // changes: content
  rpc SetUserState(SetUserStateRequest) returns (SetUserStateResponse);
  // Deletes a UserState entry. DEV code.
  // changes: content
  rpc DeleteUserState(DeleteUserStateRequest) returns (DeleteUserStateResponse);
  // Sets the balance of an item. DEV code.
  // changes: ItemBalanceUserState
  rpc SetItemBalance(SetItemBalanceRequest) returns (SetItemBalanceResponse);
  // Runs the ad network callback of a notify ID with the fake adapter. DEV code.
  // changes: ItemBalanceUserState, MailUserState, AdRewardCountUserState, content
  rpc FakeAdCallback(FakeAdCallbackRequest) returns (FakeAdCallbackResponse);
  // Sets the progress of a mission. DEV code.
  // changes: MissionProgressUserState
  rpc SetMissionProgress(SetMissionProgressRequest) returns (SetMissionProgressResponse);
  // Sets the count of a reset counter. DEV code.
  // changes: ResetCounterUserState
  rpc SetResetCounter(SetResetCounterRequest) returns (SetResetCounterResponse);
}

// Request of Login.
message LoginRequest {
  // Provider.
  LoginProvider provider = 1;
  // Credential.
  string credential = 2 [(ogw.v) = {max_len_key: "auth.maxCredentialBytes"}];
  // Agreements.
  repeated TermsAgreement agreements = 3 [(ogw.v) = {max_count: 2}];
}

// Response of Login.
message LoginResponse {
  // Result.
  AuthResult result = 1;
}

// Request of AutoLogin.
message AutoLoginRequest {
  // Agreements.
  repeated TermsAgreement agreements = 1 [(ogw.v) = {max_count: 2}];
}

// Response of AutoLogin.
message AutoLoginResponse {
  // Result.
  AuthResult result = 1;
}

// Request of RefreshToken.
message RefreshTokenRequest {
}

// Response of RefreshToken.
message RefreshTokenResponse {
  // Access token.
  string access_token = 1;
  // Access token expires time. Unix ms.
  int64 access_token_expires_at = 2;
}

// Request of Logout.
message LogoutRequest {
}

// Response of Logout.
message LogoutResponse {
}

// Request of LinkAccount.
message LinkAccountRequest {
  // Provider.
  LoginProvider provider = 1;
  // Credential.
  string credential = 2 [(ogw.v) = {max_len_key: "auth.maxCredentialBytes"}];
}

// Response of LinkAccount.
message LinkAccountResponse {
  // Linked providers.
  repeated LoginProvider linked_providers = 1;
}

// Request of Withdraw.
message WithdrawRequest {
}

// Response of Withdraw.
message WithdrawResponse {
}

// Request of IssueDeletionCode.
message IssueDeletionCodeRequest {
}

// Response of IssueDeletionCode.
message IssueDeletionCodeResponse {
  // Code.
  string code = 1;
  // Expires time. Unix ms.
  int64 expires_at = 2;
  // URL.
