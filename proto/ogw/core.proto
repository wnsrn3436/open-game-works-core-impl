message AnalyticsParam {
  // Key.
  string key = 1 [(ogw.v) = {max_chars_key: "logging.maxStringLength"}];
  // Kind.
  AnalyticsParamKind kind = 2;
  // Int value.
  int64 int_value = 3 [(ogw.v) = {min: -9223372036854775808, max: 9223372036854775807}];
  // Double value.
  double double_value = 4;
  // String value.
  string string_value = 5 [(ogw.v) = {max_chars_key: "logging.maxStringLength"}];
  // Bool value.
  bool bool_value = 6;
}

// An item ID value and an amount. The amount is a big encoding pair.
message ItemAmount {
  // Item ID value.
  int32 item_id = 1;
  // Amount. 0 when big_amount holds it.
  int64 amount = 2;
  // Amount as a big integer when it is over 2^53−1. Empty otherwise.
  string big_amount = 3;
}

// One change of an item balance.
message ItemChange {
  // Item ID value.
  int32 item_id = 1;
  // Applied signed change. 0 when big_delta holds it.
  int64 delta = 2;
  // Amount that did not fit because of max_amount. 0 unless Discard or Convert. 0 when big_overflow holds it.
  int64 overflow = 3;
  // Change source.
  ItemChangeSource source = 4;
  // Cause of the change.
  string ref = 5;
  // delta as a big integer when it is over 2^53−1. Empty otherwise.
  string big_delta = 6;
  // overflow as a big integer when it is over 2^53−1. Empty otherwise.
  string big_overflow = 7;
}

// Items sent by mail because they could not be granted right away.
message ItemMail {
  // Mail ID.
  int64 mail_id = 1;
  // Change source.
  ItemChangeSource source = 2;
  // Cause of the change.
  string ref = 3;
  // Items of the mail.
  repeated ItemAmount items = 4;
}

// One format argument of a mail template.
message MailArg {
  // Format argument name.
  string name = 1;
  // Kind.
  MailArgKind kind = 2;
  // Value of an Int argument.
  int64 int_value = 3;
  // Value of a Text argument.
  string text_value = 4;
}

// One WebSocket binary frame of /realtime. Only kind and the fields of that kind are filled.
message MatchmakerFrame {
  // Kind.
  MatchmakerFrameKind kind = 1;
  // Access token.
  string access_token = 2;
  // Data version.
  string data_version = 3;
  // Client version.
  string client_version = 4;
  // Server time time. Unix ms.
  int64 server_time_at = 5;
  // CoreError value of CLOSE.
  int32 code = 6;
  // Mode ID value.
  int32 mode_id = 7;
  // True for a DEV lockstep match.
  bool lockstep = 8;
  // Reason.
  MatchFailReason reason = 9;
  // Error code of MATCH_FAILED and ROOM_FAILED.
  int32 error_code = 10;
  // Match ID.
  string match_id = 11;
  // Players.
  repeated MatchPlayer players = 12;
  // My index.
  int32 my_index = 13;
  // Random seed of the match.
  int64 seed = 14;
  // Start time. Unix ms.
  int64 start_at = 15;
  // Transport.
  Transport transport = 16;
  // Index.
  int32 index = 17;
  // Payload.
  bytes payload = 18;
  // Ok.
  bool ok = 19;
  // Room code.
  string room_code = 20;
  // User ID.
  int64 user_id = 21;
  // User IDs in the room in join order. The first is the host.
  repeated int64 room_members = 22;
  // Room status.
  RoomStatus room_status = 23;
  // Kind of the client frame that failed.
  MatchmakerFrameKind request = 24;
  // Indices of participants that left.
  repeated int32 left_indices = 25;
}

// One participant of a match.
message MatchPlayer {
  // User ID.
  int64 user_id = 1;
  // Index.
  int32 index = 2;
  // Team number from 0. 0 when the mode has no teams.
  int32 team = 3;
  // Party number from 1 in the match. 0 for a user that queued alone.
  int32 party = 4;
}

// How the participants of a match connect.
message Transport {
  // Kind.
  TransportKind kind = 1;
  // Stun URLs.
  repeated string stun_urls = 2;
  // Relays.
  repeated TransportRelay relays = 3;
}

// A relay server and its credential.
message TransportRelay {
  // URL.
  string url = 1;
  // Username.
  string username = 2;
  // Credential.
  string credential = 3;
  // Time the credential expires. Unix ms.
  int64 expires_at = 4;
}

